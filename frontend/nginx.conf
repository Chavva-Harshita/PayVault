server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Without this, refreshing on a client-side route like /dashboard or
    # /transactions returns nginx's own 404 instead of the SPA - React
    # Router never gets a chance to handle the path because nginx looked
    # for a literal file/dashboard that doesn't exist on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
