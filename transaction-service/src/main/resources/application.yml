server:
  port: ${TRANSACTION_SERVICE_PORT:8084}

spring:
  application:
    name: transaction-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017}
      database: ${MONGODB_DATABASE_TRANSACTIONS:payvault_transactions}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Real-time updates (Phase 11). Must be the SAME secret auth-service signs
# tokens with and api-gateway validates them with - this service only
# needs it to authenticate the STOMP CONNECT frame (see
# StompAuthChannelInterceptor), never to issue tokens itself.
#noinspection YAML_UNKNOWN_PROPERTY
jwt:
  secret: "${JWT_SECRET:dev-only-please-override-32bytes!}"

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5174}

# Fault-tolerance defaults for calls to USER-SERVICE / WALLET-SERVICE.
# Feign-level timeouts stop a single slow call from hanging forever;
# the resilience4j circuit breakers below stop a REPEATEDLY failing
# downstream from being hammered with new calls once it's clearly down -
# see ResilientUserClient / ResilientWalletClient for how these are used.
feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000

resilience4j:
  circuitbreaker:
    instances:
      userService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      walletService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    com.payvault.transaction: INFO
